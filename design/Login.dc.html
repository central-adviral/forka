<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --bg:#0B0E1A; --surface:#141829; --surface-2:#1B2036;
      --border:rgba(255,255,255,0.08); --text:#E8EAF2; --text-dim:#8A90A6;
      --violet:#7C6FF0; --blue:#4F8EF7; --teal:#2DD4A8; --amber:#F5B94D; --rose:#F76C6C;
    }
    body{ margin:0; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); }
    a{ color:var(--violet); text-decoration:none; }
    a:hover{ color:#9C90F5; text-decoration:underline; }
    ::placeholder{ color:#565C74; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:var(--bg);">

  <div style="position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size:28px 28px;"></div>
  <div style="position:absolute; left:50%; top:50%; width:900px; height:900px; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(124,111,240,0.16) 0%, rgba(124,111,240,0) 65%); pointer-events:none;"></div>

  <div style="position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%;">

    <div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:36px;">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="15.5" stroke="#7C6FF0" stroke-width="1.75"/>
        <path d="M17 7 L17 17 L25 22" stroke="#4F8EF7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17 17 L9 22" stroke="#2DD4A8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.16em; color:var(--text-dim); text-transform:uppercase;">Testes A/B</div>
    </div>

    <div style="width:400px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; box-shadow:0 24px 60px rgba(0,0,0,0.45);">

      <div style="font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; margin-bottom:8px;">Entrar</div>
      <div style="font-size:14px; color:var(--text-dim); margin-bottom:28px; line-height:1.5;">Acesse seus clientes, testes e relatórios de conversão.</div>

      <div style="display:flex; flex-direction:column; gap:18px;">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label style="font-size:13px; font-weight:500; color:var(--text-dim);">E-mail</label>
          <input type="email" value="vitor@trafegoia.com.br" style="height:44px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; padding:0 14px; box-sizing:border-box;">
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label style="font-size:13px; font-weight:500; color:var(--text-dim);">Senha</label>
          <input type="password" value="••••••••••" style="height:44px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; padding:0 14px; box-sizing:border-box;">
        </div>

        <button style="margin-top:6px; height:46px; border-radius:10px; border:none; background:var(--violet); color:#0B0E1A; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; cursor:pointer;">Entrar</button>
      </div>

      <div style="display:flex; justify-content:center; margin-top:22px;">
        <a href="#">Esqueceu a senha?</a>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
